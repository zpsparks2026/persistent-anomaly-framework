name: Assemble PAF v17.1 release

on:
  push:
    branches: [main]
    paths:
      - '.release_parts/**'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct LaTeX
        shell: bash
        run: |
          cat .release_parts/part*.b64 | base64 -d | gzip -d > paf.tex
          echo "f71ef1a1fc815050dfacbb34115e80e60b242bd1d8a59502e76671dd1059f5aa  paf.tex" | sha256sum -c -

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paf.tex

      - name: Publish release files
        shell: bash
        run: |
          cp paf.pdf PAF_v17_1_FINAL_Sparks_2026.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paf.tex PAF_v17_1_FINAL_Sparks_2026.pdf
          if git diff --cached --quiet; then
            echo "Release files already current."
            exit 0
          fi
          git commit -m "Publish PAF v17.1 final paper"
          git push
